---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: test
spec:
  virtualhost:
    fqdn: example.com
    corsPolicy:
      allowCredentials: "true"
      allowHeaders: Authorization
      allowMethods: GET
      allowOrigin: https://app.example.com
      exposeHeaders: Content-Length
      maxAge: 600
  routes:
    - conditions:
        - prefix: /
      services:
        - name: test
          port: 8080
