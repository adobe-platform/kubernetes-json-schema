---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: test
spec:
  virtualhost:
    fqdn: example.com
    corsPolicy:
      allowHeaders:
        - Invalid Header
      allowMethods:
        - GET POST
      allowOrigin:
        - https://app.example.com
      exposeHeaders:
        - Invalid Header
  routes:
    - conditions:
        - prefix: /
      services:
        - name: test
          port: 8080
